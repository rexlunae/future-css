# fc-context-menu -- menu model: items, groups, and keyboard navigation.
#
# Geometry and hit-testing stay in the browser. A menu must respond to scroll,
# resize, and visual-viewport changes that only the DOM knows about, and doing
# that in WASM would mean reimplementing layout. What *is* worth putting in
# Rust is the part that is pure logic and easy to get subtly wrong in JS:
# roving-tabindex traversal, typeahead matching, and separator grouping.
#
# The boundary crosses primitives only, so this crate depends on wasm-bindgen
# alone. Not fc-core: its JsValue error conversion links js-sys (~302 KB), and a
# menu has no error worth a structured type -- an empty list answers -1.

[package]
name = "fc-context-menu"
description = "Menu model and keyboard navigation for future-css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
