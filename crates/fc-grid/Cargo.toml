# fc-grid -- spreadsheet/document grid model.
#
# The interesting cost in an Office-like surface is not rendering -- the browser
# does that -- it is the *bookkeeping*: which cells are visible, how selection
# rectangles expand, and how far a range can be addressed. Those are exactly the
# computations that are pure, integer-bound, and slow in JS once a document
# reaches six figures.
#
# This crate models a grid of cells with typed values and reports viewport ranges
# and selection geometry. It does not render, and it does not handle formulas
# (see docs/WASM.md for that decision).

[package]
name = "fc-grid"
description = "Grid, cell and selection model for future-css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fc-core = { path = "../fc-core", default-features = false }
wasm-bindgen = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true }

[features]
# `bindgen` exports the JavaScript boundary and is on by default, so the WASM
# build is unchanged. A pure Rust consumer (the Dioxus library) turns defaults
# off and gets the same model with no wasm-bindgen in its dependency tree.
# Siblings are pulled with defaults off and `bindgen` forwarded by name, so
# turning it off here turns it off all the way down rather than re-enabling it
# through a sibling's default.
default = ["bindgen"]
bindgen = ["dep:wasm-bindgen", "fc-core/bindgen"]
