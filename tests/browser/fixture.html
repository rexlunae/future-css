<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>future-css bindings fixture</title>
<link rel="stylesheet" href="../../dist/future-css.css">
<style>
  body { padding: 1.5rem; margin: 0; font-family: var(--fc-font-family-sans); }
  .stack > * { margin-block-end: 1rem; }
</style>
</head>
<body>
<div class="stack">

  <!-- The markup the bindings expect, exactly as documented. -->
  <div class="fc-editor" id="ed">
    <div class="fc-toolbar" role="toolbar" aria-label="Formatting">
      <button type="button" data-fc-mark="bold" aria-pressed="false">B</button>
      <button type="button" data-fc-mark="italic" aria-pressed="false">I</button>
      <button type="button" data-fc-mark="link" aria-pressed="false">Link</button>
    </div>
    <div class="fc-editor__content" contenteditable="true" role="textbox"
         aria-multiline="true" aria-label="Rich text">Hello plain text here</div>
  </div>

  <div class="fc-grid" id="grid" role="grid" aria-label="Demo grid"
       data-fc-rowcount="3" data-fc-colcount="3">
    <div role="row"><span role="gridcell">a1</span><span role="gridcell">b1</span><span role="gridcell">c1</span></div>
    <div role="row"><span role="gridcell">a2</span><span role="gridcell">b2</span><span role="gridcell">c2</span></div>
    <div role="row"><span role="gridcell">a3</span><span role="gridcell">b3</span><span role="gridcell">c3</span></div>
  </div>

  <button id="trigger" type="button">Right-click me</button>
  <div class="fc-menu" id="menu" popover="manual">
    <button type="button" class="fc-menu__item" role="menuitem">Cut</button>
    <button type="button" class="fc-menu__item" role="menuitem">Copy</button>
    <button type="button" class="fc-menu__item" role="menuitem" aria-disabled="true">Paste</button>
    <button type="button" class="fc-menu__item" role="menuitem">Delete</button>
  </div>

  <!--
    A terminal, so the "stays dark in both schemes" test has something to measure.
    The component needs a definite height: it is `block-size: 100%` and the CSS is
    explicit that the consumer supplies one.
  -->
  <div class="fc-terminal" id="term" data-fc-state="connected" style="block-size: 8rem;">
    <div class="fc-terminal__output" role="log" aria-live="polite" aria-label="Output">
      <div class="fc-terminal__line"><span class="fc-term-ansi-green">ok</span> build finished</div>
      <div class="fc-terminal__line"><span class="fc-term-ansi-red">error</span> one thing failed</div>
    </div>
  </div>

  <div class="fc-webview" id="wv" data-fc-home="about:blank">
    <div class="fc-webview__toolbar">
      <button type="button" data-fc-action="back" aria-label="Back">&#8592;</button>
      <button type="button" data-fc-action="forward" aria-label="Forward">&#8594;</button>
      <button type="button" data-fc-action="reload" aria-label="Reload">&#8635;</button>
      <form data-fc-role="address-form">
        <input type="text" aria-label="Address" value="about:blank">
      </form>
    </div>
    <iframe title="Embedded page"></iframe>
  </div>

  <!--
    Code surface. The `<code>` starts as plain text on purpose: the test
    enhances it with the highlighter, which is also how a real consumer uses it.
    `data-fc-lang` on the block is the single source of truth for the language.
  -->
  <div class="fc-code fc-code--numbered" id="code" data-fc-lang="typescript">
    <div class="fc-code__gutter" id="code-gutter" aria-hidden="true">
      <span>1</span><span>2</span>
    </div>
    <code class="fc-code__source" id="code-src">const x = 1;</code>
  </div>

  <!-- Diff: state lives in data-fc-diff so CSS and machines read one value. -->
  <div class="fc-diff" id="diff">
    <div class="fc-diff__bar">
      <span class="fc-diff__stat fc-diff__stat--added">+1</span>
      <span class="fc-diff__stat fc-diff__stat--removed">-1</span>
    </div>
    <div class="fc-diff__line" id="diff-remove" data-fc-diff="remove"
         aria-label="Removed: old line">
      <span class="fc-diff__marker" aria-hidden="true">-</span>
      <span class="fc-diff__num" aria-hidden="true">1</span>
      <span class="fc-diff__num" aria-hidden="true"></span>
      <span class="fc-diff__content">old line</span>
    </div>
    <div class="fc-diff__line" id="diff-add" data-fc-diff="add"
         aria-label="Added: new line">
      <span class="fc-diff__marker" aria-hidden="true">+</span>
      <span class="fc-diff__num" aria-hidden="true"></span>
      <span class="fc-diff__num" aria-hidden="true">1</span>
      <span class="fc-diff__content">new line</span>
    </div>
  </div>

  <!-- Select / listbox. Options live in the markup so the component works with
       no script at all; the binding reads them and enhances. The unavailable
       entry is deliberate: skipping it is a behaviour that is easy to get wrong
       and invisible until someone tries to select it. -->
  <div class="fc-select-field">
    <label class="fc-u-visually-hidden" for="select-invoker">Model</label>
    <button type="button" class="fc-select" id="select-invoker" data-fc-value="gpt-5"
            data-fc-placeholder="Select a model">
      <span class="fc-select__value">GPT-5</span>
      <span class="fc-select__chevron" aria-hidden="true">\u25be</span>
    </button>
    <div class="fc-select__list" id="select-list" role="listbox" aria-label="Model">
      <div class="fc-select__group-label" role="presentation">Anthropic</div>
      <div class="fc-select__option" role="option" data-fc-value="opus-5">
        <span class="fc-select__option-check" aria-hidden="true"></span>
        <span class="fc-select__option-label">Claude Opus 5</span>
      </div>
      <div class="fc-select__option" role="option" data-fc-value="sonnet-5">
        <span class="fc-select__option-check" aria-hidden="true"></span>
        <span class="fc-select__option-label">Claude Sonnet 5</span>
      </div>
      <div class="fc-select__group-label" role="presentation">OpenAI</div>
      <div class="fc-select__option" role="option" data-fc-value="gpt-5">
        <span class="fc-select__option-check" aria-hidden="true">\u2713</span>
        <span class="fc-select__option-label">GPT-5</span>
      </div>
      <div class="fc-select__option" role="option" data-fc-value="o3">
        <span class="fc-select__option-check" aria-hidden="true"></span>
        <span class="fc-select__option-label">o3</span>
      </div>
      <div class="fc-select__option" role="option" data-fc-value="llama-4" aria-disabled="true">
        <span class="fc-select__option-check" aria-hidden="true"></span>
        <span class="fc-select__option-label">Llama 4 (local)</span>
      </div>
    </div>
  </div>

  <!--
    Composer. A real <textarea>, and that is the point: an IME-composed character
    inserted into contenteditable fails silently, and composing input is routine
    in CJK and other composing scripts. The unavailable-attachment chip is
    deliberate too -- dropping a file that could not be read would leave the user
    sending a request missing what they added.
  -->
  <div class="fc-composer" id="composer-root" data-fc-state="idle">
    <label class="fc-u-visually-hidden" for="composer-input">Message</label>
    <textarea class="fc-composer__input" id="composer-input" rows="2"
              placeholder="Send a message&hellip; Enter to send, Shift+Enter for a new line"></textarea>

    <ul class="fc-composer__attachments" id="composer-attachments"></ul>

    <div class="fc-composer__row">
      <div class="fc-composer__tools">
        <button type="button" class="fc-btn fc-btn--ghost fc-btn--sm"
                id="composer-attach" aria-label="Attach files">Attach</button>
      </div>
      <button type="button" class="fc-btn fc-btn--primary fc-composer__send"
              id="composer-send" data-fc-state="idle" disabled>Send</button>
    </div>

    <p class="fc-composer__status" id="composer-status" role="status"></p>
  </div>

  <!--
    Context strip. Provider, model, and effort, plus read-only model parameters.
    The provider list is grouped; the model list is repopulated from the selected
    provider, which is the behaviour that belongs to the group and not to either
    select. One model is a reasoning model and one is not, so the effort control
    has to be dimmed for the latter.
  -->
  <div class="fc-context-strip" id="strip-root">
    <div class="fc-context-strip__field">
      <span class="fc-context-strip__label fc-u-visually-hidden">Provider</span>
      <button type="button" class="fc-select" data-fc-strip="provider" data-fc-placeholder="Provider">
        <span class="fc-select__value">Provider</span>
        <span class="fc-select__chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="fc-select__list" role="listbox" aria-label="Provider"></div>
    </div>

    <div class="fc-context-strip__field">
      <span class="fc-context-strip__label fc-u-visually-hidden">Model</span>
      <button type="button" class="fc-select" data-fc-strip="model" data-fc-placeholder="Model">
        <span class="fc-select__value">Model</span>
        <span class="fc-select__chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="fc-select__list" role="listbox" aria-label="Model"></div>
    </div>

    <div class="fc-context-strip__field">
      <span class="fc-context-strip__label fc-u-visually-hidden">Effort</span>
      <button type="button" class="fc-select" data-fc-strip="effort" data-fc-placeholder="Effort">
        <span class="fc-select__value">Effort</span>
        <span class="fc-select__chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="fc-select__list" role="listbox" aria-label="Effort"></div>
    </div>

    <span class="fc-context-strip__spacer"></span>
    <div class="fc-context-strip__params"></div>
    <span class="fc-context-strip__notice" hidden></span>
  </div>

</div>
</body>
</html>
