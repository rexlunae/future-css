<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>future-css bindings fixture</title>
<link rel="stylesheet" href="../../dist/future-css.css">
<style>
  body { padding: 1.5rem; margin: 0; font-family: var(--fc-font-family-sans); }
  .stack > * { margin-block-end: 1rem; }
</style>
</head>
<body>
<div class="stack">

  <!-- The markup the bindings expect, exactly as documented. -->
  <div class="fc-editor" id="ed">
    <div class="fc-toolbar" role="toolbar" aria-label="Formatting">
      <button type="button" data-fc-mark="bold" aria-pressed="false">B</button>
      <button type="button" data-fc-mark="italic" aria-pressed="false">I</button>
      <button type="button" data-fc-mark="link" aria-pressed="false">Link</button>
    </div>
    <div class="fc-editor__content" contenteditable="true" role="textbox"
         aria-multiline="true" aria-label="Rich text">Hello plain text here</div>
  </div>

  <div class="fc-grid" id="grid" role="grid" aria-label="Demo grid"
       data-fc-rowcount="3" data-fc-colcount="3">
    <div role="row"><span role="gridcell">a1</span><span role="gridcell">b1</span><span role="gridcell">c1</span></div>
    <div role="row"><span role="gridcell">a2</span><span role="gridcell">b2</span><span role="gridcell">c2</span></div>
    <div role="row"><span role="gridcell">a3</span><span role="gridcell">b3</span><span role="gridcell">c3</span></div>
  </div>

  <button id="trigger" type="button">Right-click me</button>
  <div class="fc-menu" id="menu" popover="manual">
    <button type="button" class="fc-menu__item" role="menuitem">Cut</button>
    <button type="button" class="fc-menu__item" role="menuitem">Copy</button>
    <button type="button" class="fc-menu__item" role="menuitem" aria-disabled="true">Paste</button>
    <button type="button" class="fc-menu__item" role="menuitem">Delete</button>
  </div>

  <!--
    A terminal, so the "stays dark in both schemes" test has something to measure.
    The component needs a definite height: it is `block-size: 100%` and the CSS is
    explicit that the consumer supplies one.
  -->
  <div class="fc-terminal" id="term" data-fc-state="connected" style="block-size: 8rem;">
    <div class="fc-terminal__output" role="log" aria-live="polite" aria-label="Output">
      <div class="fc-terminal__line"><span class="fc-term-ansi-green">ok</span> build finished</div>
      <div class="fc-terminal__line"><span class="fc-term-ansi-red">error</span> one thing failed</div>
    </div>
  </div>

  <div class="fc-webview" id="wv" data-fc-home="about:blank">
    <div class="fc-webview__toolbar">
      <button type="button" data-fc-action="back" aria-label="Back">&#8592;</button>
      <button type="button" data-fc-action="forward" aria-label="Forward">&#8594;</button>
      <button type="button" data-fc-action="reload" aria-label="Reload">&#8635;</button>
      <form data-fc-role="address-form">
        <input type="text" aria-label="Address" value="about:blank">
      </form>
    </div>
    <iframe title="Embedded page"></iframe>
  </div>

  <!--
    Code surface. The `<code>` starts as plain text on purpose: the test
    enhances it with the highlighter, which is also how a real consumer uses it.
    `data-fc-lang` on the block is the single source of truth for the language.
  -->
  <div class="fc-code fc-code--numbered" id="code" data-fc-lang="typescript">
    <div class="fc-code__gutter" id="code-gutter" aria-hidden="true">
      <span>1</span><span>2</span>
    </div>
    <code class="fc-code__source" id="code-src">const x = 1;</code>
  </div>

  <!-- Diff: state lives in data-fc-diff so CSS and machines read one value. -->
  <div class="fc-diff" id="diff">
    <div class="fc-diff__bar">
      <span class="fc-diff__stat fc-diff__stat--added">+1</span>
      <span class="fc-diff__stat fc-diff__stat--removed">-1</span>
    </div>
    <div class="fc-diff__line" id="diff-remove" data-fc-diff="remove">
      <span class="fc-diff__marker" aria-hidden="true">-</span>
      <span class="fc-diff__num" aria-hidden="true">1</span>
      <span class="fc-diff__num" aria-hidden="true"></span>
      <span class="fc-diff__content">old line</span>
    </div>
    <div class="fc-diff__line" id="diff-add" data-fc-diff="add">
      <span class="fc-diff__marker" aria-hidden="true">+</span>
      <span class="fc-diff__num" aria-hidden="true"></span>
      <span class="fc-diff__num" aria-hidden="true">1</span>
      <span class="fc-diff__content">new line</span>
    </div>
  </div>

</div>
</body>
</html>
