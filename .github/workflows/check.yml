name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require Chrome
        run: |
          chrome_path=$(command -v google-chrome || command -v chromium || true)
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Install WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.118 --locked
      # fc-theme fits its shipped budget only after wasm-opt, and Ubuntu's
      # binaryen is too old to validate what current rustc emits.
      - name: Install wasm-opt
        run: |
          npm install --prefix "$RUNNER_TEMP/binaryen" --ignore-scripts --no-save binaryen@123.0.0
          echo "$RUNNER_TEMP/binaryen/node_modules/binaryen/bin" >> "$GITHUB_PATH"
      - name: Install isolated accessibility validator
        run: |
          npm install --prefix "$RUNNER_TEMP/fc-validation" --ignore-scripts --no-save axe-core@4.11.1
          echo "FC_AXE_SOURCE=$RUNNER_TEMP/fc-validation/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - run: npm run check
